[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbreduce"
version = "0.4.0"
description = "Reduce PostgreSQL bug reproducers using delta debugging"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = ["psycopg[binary]>=3.2,<4", "typer>=0.16,<1"]

[project.urls]
Homepage = "https://github.com/0then0/dbreduce"
Repository = "https://github.com/0then0/dbreduce"
Documentation = "https://github.com/0then0/dbreduce/blob/main/docs/guide.md"
Issues = "https://github.com/0then0/dbreduce/issues"

[project.scripts]
dbreduce = "dbreduce.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.16,<2"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires DBREDUCE_TEST_ADMIN and PostgreSQL client tools"]
