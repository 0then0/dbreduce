name: Bug report
description: Report a reproducible DBReduce failure or regression.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow SECURITY.md instead of posting details here.
        Use synthetic data and remove credentials, database URLs and private output.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Describe the problem and its effect on the reproducer.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal schema/data example, sanitized command and oracle.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Versions and configuration
      description: DBReduce, Python, OS, PostgreSQL server and client versions, backend and oracle mode.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized results
      description: Error, report counts, failure identity preservation and fresh-restore result, if available.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed credentials, private data and sensitive oracle output.
          required: true
